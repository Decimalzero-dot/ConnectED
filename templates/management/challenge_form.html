{% extends 'base.html' %}
{% block title %}{{ action }} Challenge — ConnectED{% endblock %}

{% block content %}
<h2 class="mb-4">{{ action }} Challenge</h2>
<div class="col-md-8">
    <form method="post">
        {% csrf_token %}
        {% for field in form %}
            <div class="mb-3">
                <label class="form-label">{{ field.label }}</label>
                {{ field }}
                {% if field.errors %}<div class="text-danger small">{{ field.errors }}</div>{% endif %}
            </div>
        {% endfor %}
        <button type="submit" class="btn btn-primary">{{ action }} Challenge</button>
        <a href="{% url 'challenges:list' %}" class="btn btn-outline-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
