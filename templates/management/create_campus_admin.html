{% extends 'base.html' %}
{% block title %}Create Campus Admin — ConnectED{% endblock %}

{% block content %}
<h2 class="mb-4">Create Campus Admin</h2>
<div class="col-md-6">
    <form method="post">
        {% csrf_token %}
        <div class="mb-3">
            <label class="form-label">Username</label>
            <input type="text" name="username" class="form-control" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" name="email" class="form-control" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Temporary Password</label>
            <input type="password" name="password" class="form-control" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Assign to University</label>
            <select name="university" class="form-control" required>
                <option value="">Select university</option>
                {% for uni in universities %}
                    <option value="{{ uni.pk }}">{{ uni.name }}</option>
                {% endfor %}
            </select>
        </div>
        <button type="submit" class="btn btn-primary">Create Admin</button>
        <a href="{% url 'management:admin_list' %}" class="btn btn-outline-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
