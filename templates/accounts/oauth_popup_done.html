<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>ConnectED</title>
<style>
 body{font-family:system-ui,sans-serif;display:grid;place-items:center;min-height:100vh;margin:0;
      background:#f7f8f4;color:#102b35;text-align:center;padding:1rem}
 .ok{color:#107d79}.bad{color:#b3261e}a{color:#107d79;font-weight:700}
</style></head>
<body><div>
  <h2 class="{% if ok %}ok{% else %}bad{% endif %}">{% if ok %}Connected{% else %}Not connected{% endif %}</h2>
  <p>{{ message }}</p>
  <p><a href="{{ back }}">Back to ConnectED</a></p>
</div>
{{ message|json_script:"msg" }}
{{ back|json_script:"back" }}
<script>
(function () {
  var payload = { type: 'oauth-done', provider: 'github', ok: {{ ok|yesno:"true,false" }},
                  message: JSON.parse(document.getElementById('msg').textContent) };
  var delivered = false;
  try { if (window.opener && !window.opener.closed) {
          window.opener.postMessage(payload, window.location.origin); delivered = true; } } catch (e) {}
  try { if ('BroadcastChannel' in window) {
          var bc = new BroadcastChannel('connected-oauth'); bc.postMessage(payload); bc.close(); delivered = true; } } catch (e) {}
  if (delivered) setTimeout(function () { window.close(); }, payload.ok ? 700 : 2500);
  else setTimeout(function () { window.location.replace(JSON.parse(document.getElementById('back').textContent)); }, 1500);
})();
</script></body></html>
