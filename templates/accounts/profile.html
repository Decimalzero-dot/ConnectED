{% extends 'base.html' %}
{% block title %}My Profile - ConnectED{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <h2 class="mb-4">My Profile</h2>

        {% if user.profile_image %}
            <img src="{{ user.profile_image.url }}" alt="Profile" class="rounded-circle mb-3" width="100" height="100">
        {% endif %}

        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}
            {% for field in form %}
                <div class="mb-3">
                    <label class="form-label">{{ field.label }}</label>
                    {{ field }}
                    {% if field.errors %}
                        <div class="text-danger small">{{ field.errors }}</div>
                    {% endif %}
                </div>
            {% endfor %}
            <button type="submit" class="btn btn-primary">Save Changes</button>
        </form>
    </div>
</div>
{% endblock %}
