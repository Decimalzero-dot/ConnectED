{% extends 'base.html' %}
{% block title %}Notifications - ConnectED{% endblock %}

{% block content %}
<h2 class="mb-4">Notifications</h2>
{% for notif in notifications %}
<div class="card mb-2">
    <div class="card-body py-2">
        <a href="{% url 'notifications:go' notif.pk %}" class="text-decoration-none">{{ notif.message }}</a>
        <small class="text-muted d-block">{{ notif.created_at|timesince }} ago</small>
    </div>
</div>
{% empty %}
<p class="text-muted">No notifications yet.</p>
{% endfor %}
{% endblock %}
